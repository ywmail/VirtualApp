import java.text.SimpleDateFormat

ext {

    PACKAGE_NAME                = "com.ywmail.virtualapp"
    EXT_PACKAGE_NAME            = "com.ywmail.virtualapp.ext"


    VA_MAIN_PACKAGE_32BIT       = false
    VA_ACCESS_PERMISSION_NAME   = "com.ywmail.virtualapp.permission.SAFE_ACCESS"
    VA_AUTHORITY_PREFIX         = "com.ywmail.virtualapp"
    VA_EXT_AUTHORITY_PREFIX     = "com.ywmail.virtualapp"
    VA_VERSION                  = '2.3.2'
    VA_VERSION_CODE             = 23202
    VA_FULL_EXT                 = true //如果这个是true ,那么将32里面的一些代码都会打包到插件apk 里面来

    signing_storeFile           = System.getenv('SIGNING_STORE_FILE') ?: "${rootDir}/security/scorpion.jks"
    signing_storePassword       = System.getenv('SIGNING_STORE_PASSWORD') ?: "scorpion123"
    signing_keyAlias            = System.getenv('SIGNING_KEY_ALIAS') ?: "scorpion"
    signing_keyPassword         = System.getenv('SIGNING_KEY_PASSWORD') ?: "scorpion123"
}