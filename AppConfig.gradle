allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
        google()
        mavenCentral()
        maven {
            url 'https://maven.aliyun.com/nexus/content/groups/public/'
        }
        maven {
            url 'https://maven.aliyun.com/nexus/content/repositories/jcenter'
        }
    }
}

subprojects {

    afterEvaluate {
        // commonSdk 模块用 phong12a5 原配置（compileSdk 33 + Java 1.8），
        // 因为它的 dalvik.system.VMRuntime stub 跟 compileSdk 36 的 android.jar 冲突。
        if (project.name == 'commonSdk') {
            return
        }

        def isAndroidProject = project.plugins.hasPlugin('android')
        def isLibraryProject = project.plugins.hasPlugin('android-library')

        if (isAndroidProject || isLibraryProject) {
            android {
                compileSdk 36

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }

                if (new File(projectDir, "src/main/cpp/CMakeLists.txt").exists()) {
                    externalNativeBuild {
                        cmake {
                            path "src/main/cpp/CMakeLists.txt"
                        }
                    }
                }

                defaultConfig {
                    minSdk 21
                    //noinspection OldTargetApi
                    targetSdk 26

                    versionCode rootProject.ext.VA_VERSION_CODE
                    versionName rootProject.ext.VA_VERSION
                }

                ndkVersion "27.0.12077973"

                lint {
                    checkReleaseBuilds false
                    abortOnError false
                }
            }
        }

        if (isAndroidProject) {
            android {
                signingConfigs {
                    va {
                        storeFile       file(rootProject.ext.signing_storeFile)
                        storePassword   rootProject.ext.signing_storePassword
                        keyAlias        rootProject.ext.signing_keyAlias
                        keyPassword     rootProject.ext.signing_keyPassword
                    }
                }

                buildTypes {
                    release {
                        signingConfig signingConfigs.va
                        minifyEnabled true
                        shrinkResources true
                        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), "${rootProject.rootDir}/proguard/proguard-rules.pro", "proguard-rules.pro"
                    }

                    debug {
                        signingConfig release.signingConfig
                        crunchPngs false
                        minifyEnabled false

                        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), "${rootProject.rootDir}/proguard/proguard-rules.pro", "proguard-rules.pro"
                    }
                }
            }
        }
    }
}
